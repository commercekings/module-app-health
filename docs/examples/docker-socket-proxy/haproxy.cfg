# A read-only window on Docker for host-status.sh in a container: the container list and each container's stats,
# nothing else. Docker's socket is the whole Docker API (start a privileged container = root on the host), and even a
# GET can leak: /containers/{id}/json has the environment (database and queue passwords), /archive any file, /logs
# and /export the rest. So the rules are exact paths, not "everything under /containers":
#   GET|HEAD /_ping, /version                 the Docker CLI's version check
#   GET /containers/json                      the list: name, state, status ("Up 2 hours (healthy)", "Exited (1)"),
#                                             and also each container's command line, labels, image, ports and
#                                             mounts - keep secrets out of command lines and labels
#   GET /containers/<id or name>/stats        CPU, memory, network and block I/O
# Anything else - any other path, any other method - is refused with 403.
global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker
    bind :2375
    acl read_method method GET HEAD
    acl version_check path_reg ^(/v[0-9.]+)?/(_ping|version)$
    acl container_list path_reg ^/v[0-9.]+/containers/json$
    acl container_stats path_reg ^/v[0-9.]+/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/stats$
    http-request deny deny_status 403 unless read_method
    http-request deny deny_status 403 unless version_check or container_list or container_stats
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
