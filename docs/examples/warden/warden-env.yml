# App health's server status for a Warden project: add these services to the project's .warden/warden-env.yml.
# Off by default (the profile "host-status"); start: warden env up -d host-status (it starts its proxy too),
# stop: warden env rm -sf host-status docker-socket-proxy.
#
# Why the proxy: Docker's socket - even mounted :ro - is the whole Docker API, so a container holding it can start a
# privileged container, i.e. it is root on the host. The proxy (HAProxy) hands the script only what it needs: GET on
# /containers (state, health, restarts, stats), plus /_ping and /version for the Docker CLI. POST is off (nothing can
# be created, started, stopped or exec'd), and the proxy sits on an internal network of its own - nothing else reaches
# it, and it reaches nothing.
#
# The sidecar runs host-status.sh every minute as the web server's user (1000:1000 in Warden's php-fpm; `id` in it
# tells), mounts only Magento's var/app-health (a subpath of Warden's "appdata" volume, the Magento root) and talks to
# Docker through the proxy (DOCKER_HOST). Copy docs/examples/host-status.sh next to this file (./.warden/), or mount it
# from vendor/commercekings/module-app-health/docs/examples/host-status.sh.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [host-status]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [host-status]

  host-status:
    image: alpine:3.20
    profiles: [host-status]
    restart: unless-stopped
    depends_on: [docker-socket-proxy]
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      CK_SOURCE: dev-box
      CK_STATUS_DIR: /status
      CK_COMPOSE_PROJECT: ${WARDEN_ENV_NAME}
      CK_DISKS: /
    volumes:
      - type: volume
        source: appdata
        target: /status
        volume:
          subpath: var/app-health
      - ./.warden/host-status.sh:/usr/local/bin/host-status.sh:ro
    networks: [default, host-status]
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache -q bash jq coreutils docker-cli su-exec && exec su-exec 1000:1000 bash -c 'while :; do bash /usr/local/bin/host-status.sh || echo host-status failed >&2; sleep 60; done'"]

networks:
  host-status:
    internal: true
