# App health's server status for a Warden project: add these services to the project's .warden/warden-env.yml and
# copy ../docker-socket-proxy/haproxy.cfg, ../host-status-image/Dockerfile and ../host-status.sh into .warden/
# (keeping the folder names). Off by default (the profile "host-status"); start: warden env up -d --build host-status
# (it starts its proxy too), stop: warden env rm -sf host-status docker-socket-proxy, then
# docker network rm <WARDEN_ENV_NAME>_host-status. Needs Docker Compose 2.23 or later (volume subpath).
#
# Why a proxy, and this one: Docker's socket - even mounted :ro - is the whole Docker API (start a privileged
# container = root on the host), and even its GETs leak: a container's /json has its environment (database and queue
# passwords), /archive any file, /logs and /export the rest. HAProxy with haproxy.cfg passes exactly the container
# list and each container's stats (plus the CLI's /_ping and /version); everything else gets 403. Restarts would need
# /json, so the script runs without them here. Both containers sit on an internal network only; the script's tools
# are built into its image (nothing is installed at runtime). It runs as Warden php-fpm's www-data (1000) and mounts
# only Magento's var/app-health (a subpath of Warden's "appdata" volume, the Magento root).
services:
  docker-socket-proxy:
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    profiles: [host-status]
    restart: unless-stopped
    user: "0:0" # only to open Docker's socket; no capabilities beyond that
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.warden/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [host-status]

  host-status:
    build: ./.warden/host-status-image
    image: commercekings/host-status:local
    profiles: [host-status]
    restart: unless-stopped
    depends_on: [docker-socket-proxy]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOCKER_CONFIG: /tmp/.docker
      CK_CONTAINER_RESTARTS: "0"
      CK_SOURCE: dev-box
      CK_STATUS_DIR: /status
      CK_COMPOSE_PROJECT: ${WARDEN_ENV_NAME}
      CK_DISKS: /
    volumes:
      - type: volume
        source: appdata
        target: /status
        volume:
          subpath: var/app-health
      - ./.warden/host-status.sh:/usr/local/bin/host-status.sh:ro
    networks: [host-status]

networks:
  host-status:
    internal: true
