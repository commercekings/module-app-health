# App health's server status for a Docker Compose stack: use it next to your stack's own file,
#   docker compose -f docker-compose.yml -f docker-compose.host-status.yml --profile host-status up -d --build
# stop: docker compose ... rm -sf host-status docker-socket-proxy && docker network rm <project>_host-status
# Copy next to it: ../docker-socket-proxy/haproxy.cfg, ../host-status-image/Dockerfile and ../host-status.sh, keeping
# the folder names. Set the three values marked "yours".
#
# Why a proxy, and this one: Docker's socket - even mounted :ro - is the whole Docker API (start a privileged
# container = root on the host), and even its GETs leak: a container's /json has its environment (database and queue
# passwords), /archive any file, /logs and /export the rest. HAProxy with haproxy.cfg passes exactly the container
# list and each container's stats (plus the CLI's /_ping and /version); everything else gets 403. Restarts would need
# /json, so the script runs without them here (CK_CONTAINER_RESTARTS=0). Both containers sit on an internal network
# only: the proxy is reachable from the script alone, and neither reaches the internet (the script's tools are built
# into its image, nothing is installed at runtime). On a server you run yourself, the host timer (../systemd/) needs
# no proxy at all and is the better choice.
services:
  docker-socket-proxy:
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    profiles: [host-status]
    restart: unless-stopped
    user: "0:0" # only to open Docker's socket (root:docker 0660); no capabilities beyond that
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [host-status]

  host-status:
    build: ./host-status-image
    image: commercekings/host-status:local
    profiles: [host-status]
    restart: unless-stopped
    depends_on: [docker-socket-proxy]
    # yours: the uid:gid PHP runs as in your Magento container (it owns var/; `id` in it tells)
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOCKER_CONFIG: /tmp/.docker
      CK_CONTAINER_RESTARTS: "0"
      CK_SOURCE: shop-1
      CK_STATUS_DIR: /status
      CK_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-shop}
      CK_DISKS: /
    volumes:
      # yours: the host folder or volume that is Magento's var/ (here a bind mount of it); the folder must exist and
      # belong to the user above, e.g. mkdir -p var/app-health && chown 1000:1000 var/app-health (Magento creates it
      # with the right owner on its first check run)
      - ./var/app-health:/status
      # yours: where you keep the script
      - ./host-status.sh:/usr/local/bin/host-status.sh:ro
    networks: [host-status]

networks:
  host-status:
    internal: true
